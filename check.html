<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resultado — Guía de Desbloqueos Apple</title>
<style>
  :root{
    --bg:#10141A; --surface:#1A2029; --surface-2:#212836; --border:#2A3140;
    --text:#F1F3F6; --muted:#8A93A3; --copper:#E2A33B; --copper-dim:#4A3A22;
    --cyan:#56C2D6; --green:#6FCF7C; --red:#E2574C; --purple:#B48CDE; --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh; padding:0 0 60px;
  }
  ::selection{background:var(--copper);color:#10141A;}

  header{
    background:linear-gradient(135deg,#1A2029,#212836);
    border-bottom:1px solid var(--border);
    padding:28px 20px; text-align:center;
  }
  header h1{margin:0 0 6px;font-size:22px;letter-spacing:-.01em;}
  header p{margin:0;color:var(--muted);font-size:13px;}
  header .badge{
    display:inline-block;margin-top:10px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--copper);border:1px solid var(--copper-dim);background:var(--copper-dim);
    padding:4px 12px;border-radius:20px;
  }

  .wrap{max-width:640px;margin:0 auto;padding:24px 20px;}

  .result-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;}
  .result-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
  .result-title{font-size:19px;font-weight:700;margin:0;}
  .result-sub{color:var(--muted);font-size:13px;margin:4px 0 0;}
  .verdict{
    font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    border-radius:20px;padding:6px 14px;white-space:nowrap;
  }
  .verdict.yes{color:var(--green);border:1.5px solid var(--green);}
  .verdict.pending{color:var(--muted);border:1.5px solid var(--border);}

  .info-block{
    background:var(--surface-2);border-left:3px solid var(--copper);border-radius:0 8px 8px 0;
    padding:14px 16px;margin-bottom:12px;font-size:13.5px;line-height:1.55;
  }
  .info-block strong{color:var(--copper);}
  .info-block.signal-ok{border-left-color:var(--green);}
  .info-block.signal-off{border-left-color:var(--red);}

  .meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
  .meta-item{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;}
  .meta-item .label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px;}
  .meta-item .value{font-size:14px;font-weight:600;}

  .download-btn{
    display:block;text-align:center;background:#ff9800;color:#181206;text-decoration:none;
    padding:13px;border-radius:8px;font-weight:700;font-size:14px;margin-bottom:10px;
  }
  .download-btn:hover{filter:brightness(1.05);}

  .back-btn{
    display:block;text-align:center;background:transparent;border:1px solid var(--border);color:var(--text);
    text-decoration:none;padding:12px;border-radius:8px;font-weight:600;font-size:13.5px;
  }
  .back-btn:hover{border-color:var(--copper);color:var(--copper);}

  .empty-card{text-align:center;padding:50px 20px;color:var(--muted);}
  .empty-card h2{color:var(--text);font-size:17px;margin:0 0 8px;}

  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:30px;}
</style>
</head>
<body>

<header>
  <h1>Guía de Desbloqueos Apple</h1>
  <p>Resultado de la consulta</p>
  <span class="badge">Uso interno · Proveedor Principal</span>
</header>

<div class="wrap">
  <div class="result-card" id="resultCard">Cargando resultado...</div>
</div>

<footer>Información confidencial de uso interno — no compartir fuera del equipo.</footer>

<script>
/* ============================================================
   EDITA AQUÍ los links de descarga de cada nivel de equipo.
   Cuando tengas el link real, reemplaza el '#' entre comillas.
   ============================================================ */
const LINKS = {
  1: '#',   // iPhone 6s al X
  2: '#',   // iPhone XS al 11 Pro Max
  3: '#'    // iPhone 12 al 17 Pro Max
};

const lockLabels = {icloud:'Bloqueo de iCloud', screen:'Bloqueo de pantalla / PIN', mdm:'Bloqueo MDM', carrier:'Bloqueo de compañía telefónica'};

const resultCard = document.getElementById('resultCard');

function renderEmpty(){
  resultCard.innerHTML = `
    <div class="empty-card">
      <h2>No hay datos de consulta</h2>
      <p>Vuelve a la guía y completa el formulario para ver un resultado.</p>
      <a class="back-btn" href="index.html" style="margin-top:16px;display:inline-block;">Volver a la guía</a>
    </div>
  `;
}

function renderResultado(model, group, tier, lockType, screenState, iosVersion){
  let info = '';
  let signalBlock = '';
  let herramienta = null;
  const precio = '$5 USD';

  if(tier === 1){
    info = 'Este equipo <strong>siempre se puede desbloquear</strong>. Es el nivel más sencillo de la guía.';
    signalBlock = `<div class="info-block signal-ok">
      Puede quedar <strong>con señal</strong>, pero hay que validarlo con el software correspondiente antes de entregarlo.
      <br><br>Si el equipo conserva señal, cóbrale un extra al cliente sobre el precio base.
    </div>`;
  }

  if(tier === 2){
    info = 'Este equipo <strong>se puede desbloquear en cualquier versión de iOS</strong>.';
    herramienta = 'Microcontrolador RP2450';
    if(screenState === 'pin'){
      signalBlock = `<div class="info-block signal-ok">
        Con el equipo en pantalla de <strong>PIN / "iPhone no disponible"</strong>, va a quedar <strong>con señal</strong> después del desbloqueo.
      </div>`;
    } else {
      signalBlock = `<div class="info-block signal-off">
        Con el equipo en pantalla <strong>Hello</strong>, va a quedar <strong>sin señal</strong> — aun así, sí se logra desbloquear.
      </div>`;
    }
  }

  if(tier === 3){
    info = 'Este equipo <strong>se puede desbloquear</strong>, pero el resultado depende de la versión de iOS. Debe estar en <strong>pantalla Hello</strong>.';
    if(iosVersion.startsWith('26.1')){
      signalBlock = `<div class="info-block signal-off">
        En <strong>iOS 26.1</strong> solo aplica <strong>bypass</strong> — el equipo queda <strong>sin señal</strong>.
      </div>`;
    } else {
      signalBlock = `<div class="info-block">
        Versión de iOS indicada: <strong>${iosVersion || '—'}</strong>. Valida el alcance exacto según esa versión específica antes de proceder.
      </div>`;
    }
  }

  if(lockType === 'mdm' || lockType === 'carrier'){
    info += ` Para <strong>${lockLabels[lockType]}</strong>, este panel es solo referencia general — confirma el caso directamente con el proveedor principal antes de proceder.`;
  }

  const link = LINKS[tier];
  const linkHtml = link && link !== '#'
    ? `<a class="download-btn" href="${link}" target="_blank" rel="noopener">Descargar herramienta</a>`
    : `<a class="download-btn" href="#" onclick="event.preventDefault(); alert('Todavía no hay link cargado para este nivel. Edítalo en el bloque LINKS del código.');">Descargar herramienta</a>`;

  resultCard.innerHTML = `
    <div class="result-top">
      <div>
        <p class="result-title">${model}</p>
        <p class="result-sub">${lockLabels[lockType] || lockType} · ${group}</p>
      </div>
      <span class="verdict yes">Sí se puede</span>
    </div>

    <div class="info-block">${info}</div>
    ${signalBlock}

    <div class="meta-grid">
      <div class="meta-item"><div class="label">Precio base</div><div class="value">${precio}</div></div>
      <div class="meta-item"><div class="label">Herramienta</div><div class="value">${herramienta || 'No requiere adicional'}</div></div>
    </div>

    ${linkHtml}
    <a class="back-btn" href="index.html">&larr; Volver a la guía</a>
  `;
}

/* ---------- Leer parámetros de la URL y renderizar ---------- */
(function init(){
  const params = new URLSearchParams(window.location.search);
  const model = params.get('model');
  const group = params.get('group');
  const tier = parseInt(params.get('tier'), 10);
  const lockType = params.get('lock');
  const screenState = params.get('screen') || '';
  const iosVersion = params.get('ios') || '';

  if(!model || !group || !tier || !lockType){
    renderEmpty();
    return;
  }
  renderResultado(model, group, tier, lockType, screenState, iosVersion);
})();
</script>
</body>
</html>
