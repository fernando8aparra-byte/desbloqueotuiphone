<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resultado — Compatibilidad de desbloqueo</title>
<link rel="stylesheet" href="style.css">
<style>
  .result-wrap{max-width:760px;margin:0 auto;padding:32px 20px;}
  .result-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:26px;}
  .result-top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:18px;}
  .result-title{font-family:'Space Grotesk',sans-serif;font-size:24px;margin:0 0 6px;}
  .result-sub{color:var(--muted);margin:0;font-size:14px;}
  .verdict{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;text-transform:uppercase;border-radius:20px;padding:8px 14px;border:1px solid var(--border);}
  .verdict.yes{color:var(--green);border-color:var(--green);}
  .verdict.no{color:var(--red);border-color:var(--red);}
  .info-block{background:var(--surface-2);border-left:3px solid var(--copper);border-radius:0 10px 10px 0;padding:14px 16px;margin:12px 0;line-height:1.55;color:var(--text);}
  .info-block.good{border-left-color:var(--green);}.info-block.bad{border-left-color:var(--red);}
  .meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:18px 0;}
  .meta-item{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px;}
  .meta-item .label{font-family:'JetBrains Mono',monospace;color:var(--muted);font-size:11px;text-transform:uppercase;margin-bottom:5px;}
  .meta-item .value{font-weight:700;}
  .download-btn{display:block;text-align:center;background:var(--copper);color:#181206;text-decoration:none;border-radius:10px;padding:14px;font-weight:800;margin:12px 0;}
  .tool-result-list{display:grid;gap:8px;margin:14px 0;}
  .tool-result-list div{background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:10px 12px;font-size:13px;}
  .tool-result-list .ok{color:var(--green);font-weight:800;margin-right:8px;}
  .tool-result-list .missing{color:var(--muted);font-weight:800;margin-right:8px;}
  .back-btn{display:block;text-align:center;border:1px solid var(--border);color:var(--text);text-decoration:none;border-radius:10px;padding:12px;font-weight:700;}
</style>
</head>
<body>
<div class="topbar"><div class="topbar-inner"><div class="brand"><span class="brand-name">Guía de Desbloqueos Apple<small>Resultado interno</small></span></div></div></div>
<main class="result-wrap">
  <div class="result-card" id="resultCard">Cargando resultado...</div>
</main>
<script>
const LINKS = {
  1: '#', // iPhone 6s al X: reemplaza # por tu link de descarga
  2: '#', // iPhone XS al 11 Pro Max: reemplaza # por tu link de descarga
  3: '#', // iPhone 12 al 17 Pro Max: reemplaza # por tu link de descarga
  4: '#'  // Android: reemplaza # por tu link de descarga
};
const lockLabels = {icloud:'Bloqueo de iCloud', pin:'Bloqueo de pantalla / PIN', mdm:'Bloqueo MDM', compania:'Bloqueo de compañía telefónica'};
const screenLabels = {hello:'Hello / activación', pin:'PIN', unavailable:'iPhone no disponible', other:'Otro'};
const resultCard = document.getElementById('resultCard');
function empty(){resultCard.innerHTML = '<h1 class="result-title">Sin datos</h1><p class="result-sub">Vuelve a index.html y completa la consulta.</p><a class="back-btn" href="index.html">Volver</a>';}
function downloadLink(tier){
  const link = LINKS[tier];
  if(link && link !== '#') return `<a class="download-btn" href="${link}" target="_blank" rel="noopener">Descargar herramienta</a>`;
  return `<a class="download-btn" href="#" onclick="event.preventDefault();alert('Edita el bloque LINKS en check.html y reemplaza # por tu link real.');">Descargar herramienta</a>`;
}
function details(tier, can, screen, ios){
  if(tier === 1) return ['Siempre se puede desbloquear. Precio base $5 USD.', 'Puede quedar con señal, pero debe validarse con el software. Si queda con señal, pide más dinero.'];
  if(tier === 2){
    const signal = screen === 'hello' ? 'En Hello queda sin señal.' : 'En PIN o iPhone no disponible puede quedar con señal.';
    return ['Compatible en cualquier versión de iOS para XS al 11 Pro Max. Requiere microcontrolador RP2450.', signal];
  }
  if(tier === 3){
    return can ? ['Compatible si está en Hello y iOS 26.1.', 'Solo bypass sin señal. Precio base $5 USD.'] : ['No confirmado con los datos ingresados.', 'Para 12 a 17 Pro Max debe estar en Hello y iOS 26.1; solo bypass sin señal.'];
  }
  if(tier === 4) return ['Android requiere revisión por marca, parche de seguridad y tipo de bloqueo.', 'Se recomienda diagnosticar con herramienta FRP/ADB antes de confirmar señal o liberación de compañía.'];
  return ['Modelo fuera de las reglas cargadas.', 'Agrega una regla nueva si tu procedimiento lo permite.'];
}
(function init(){
  const p = new URLSearchParams(location.search);
  const model = p.get('model'), group = p.get('group'), tier = Number(p.get('tier')), lock = p.get('lock'), screen = p.get('screen'), ios = p.get('ios') || 'No indicado', can = p.get('can') === '1';
  const tools = (p.get('tools') || '').split('|').filter(Boolean);
  const installed = (p.get('installed') || '').split('|').filter(Boolean);
  if(!model || !group || !tier || !lock){ empty(); return; }
  const lines = details(tier, can, screen, ios);
  const toolHtml = tools.length ? `<div class="tool-result-list">${tools.map(tool => `<div><span class="${installed.includes(tool) ? 'ok' : 'missing'}">${installed.includes(tool) ? '✓' : '—'}</span>${tool}</div>`).join('')}</div>` : '';
  resultCard.innerHTML = `<div class="result-top"><div><h1 class="result-title">${model}</h1><p class="result-sub">${group} · ${lockLabels[lock] || lock}</p></div><span class="verdict ${can ? 'yes' : 'no'}">${can ? 'Sí se puede' : 'No confirmado'}</span></div><div class="info-block ${can ? 'good' : 'bad'}"><strong>Resultado:</strong> ${lines[0]}<br>${lines[1]}</div><div class="meta-grid"><div class="meta-item"><div class="label">Pantalla</div><div class="value">${screenLabels[screen] || 'No indicada'}</div></div><div class="meta-item"><div class="label">iOS/versión</div><div class="value">${ios}</div></div><div class="meta-item"><div class="label">Precio base</div><div class="value">$5 USD</div></div><div class="meta-item"><div class="label">Herramienta extra</div><div class="value">${tier === 2 ? 'RP2450' : 'Software'}</div></div></div>${toolHtml}${downloadLink(tier)}<a class="back-btn" href="index.html">← Nueva consulta</a>`;
})();
</script>
</body>
</html>
